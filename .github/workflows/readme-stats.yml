# Regenerates everything on the profile that comes from live data: the npm
# table between the STATS markers in README.md, and the install card SVGs in
# assets/. Reads the public npm registry and commits with the workflow's own
# token — there are no secrets to configure.
name: Refresh README stats

on:
  schedule:
    - cron: "30 3 * * *" # daily, 03:30 UTC — after npm rolls its download counters
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Rewrite the table and re-render the cards
        run: node .github/scripts/update-stats.mjs
        env:
          # Repo variable, not a secret — Settings -> Secrets and variables ->
          # Actions -> Variables. Points at the self-hosted github-readme-stats
          # instance. Unset, or unreachable, and the cards are left out of the
          # README rather than embedded as broken images.
          STATS_HOST: ${{ vars.STATS_HOST }}

      # No-ops when the numbers are unchanged, so quiet days leave no commit.
      - name: Commit if anything moved
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh npm stats"
          file_pattern: README.md assets/*.svg
