# A profile README is a shop window — a dead App Store or npm link is worse than
# no link. Crawls every URL weekly and opens an issue listing the broken ones.
name: Link check

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  push:
    branches: [main]
    paths: ["README.md"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Crawl README links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --max-concurrency 4
            --accept 200,204,206,429
            README.md
          fail: false
          output: ./lychee/out.md

      - name: Open an issue for the broken ones
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links in README.md
          content-filepath: ./lychee/out.md
          labels: bug, links
